<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Power Recorder – BLE to FIT</title>
  <style>
    :root {
      --bg: #0e1013;
      --card: #181b20;
      --fg: #f2f4f7;
      --mut: #7d8590;
      --line: #262b33;
      --pow: #4cc2ff;
      --cad: #5ee0a0;
      --bad: #ff5d5d;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
    }

    body {
      font: 16px/1.35 system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: max(10px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
      max-width: 900px;
      margin: 0 auto;
    }

    .top {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--mut);
      font-size: 14px;
      min-height: 24px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #444b55;
      flex: none;
    }

    .dot.on {
      background: var(--cad);
    }

    .dot.rec {
      background: var(--bad);
      animation: p 1.2s infinite;
    }

    @keyframes p {
      50% {
        opacity: .25;
      }
    }

    .hero {
      display: grid;
      gap: 0;
      margin: 6px 0 2px;
    }

    .metric {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 10px;
    }

    .num {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      letter-spacing: -.03em;
    }

    .unit {
      color: var(--mut);
      font-size: clamp(16px, 4.5vw, 26px);
    }

    .power .num {
      font-size: clamp(88px, 34vw, 230px);
      color: var(--pow);
    }

    .cad .num {
      font-size: clamp(60px, 22vw, 150px);
      color: var(--cad);
    }

    .minor {
      display: flex;
      justify-content: center;
      gap: 36px;
      color: var(--mut);
      margin: 4px 0 10px;
    }

    .minor .k {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-right: 8px;
    }

    .minor .v {
      font-size: 20px;
      color: var(--fg);
      font-variant-numeric: tabular-nums;
    }

    .chartwrap {
      position: relative;
      flex: 1 1 120px;
      min-height: 120px;
      max-height: 260px;
      margin-bottom: 12px;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .controls button {
      flex: 1;
      height: 64px;
      font-size: 20px;
      font-weight: 600;
    }

    button,
    select {
      background: var(--card);
      color: var(--fg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 15px;
      font-family: inherit;
    }

    button:disabled {
      opacity: .4;
    }

    button.primary {
      background: var(--pow);
      color: #04141f;
      border-color: var(--pow);
    }

    button.go {
      background: var(--cad);
      color: #032014;
      border-color: var(--cad);
    }

    button.danger {
      background: var(--bad);
      color: #fff;
      border-color: var(--bad);
    }

    details {
      margin-top: 6px;
    }

    summary {
      color: var(--mut);
      padding: 10px 0;
      cursor: pointer;
      font-size: 14px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
      align-items: center;
    }

    .note {
      color: var(--mut);
      font-size: 13px;
    }

    .sess {
      background: var(--card);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .sess .row {
      margin: 8px 0 0;
    }

    label {
      color: var(--mut);
      font-size: 13px;
    }

    @media (orientation:landscape) and (max-height:520px) {
      body {
        padding-top: 6px;
      }

      .hero {
        grid-template-columns: 1.25fr 1fr;
        align-items: center;
        margin: 0;
      }

      .power .num {
        font-size: min(22vw, 34vh);
      }

      .cad .num {
        font-size: min(15vw, 26vh);
      }

      .minor {
        margin: 0 0 6px;
      }

      .chartwrap {
        min-height: 70px;
        max-height: none;
        margin-bottom: 8px;
      }

      .controls {
        margin-bottom: 6px;
      }

      .controls button {
        height: 46px;
        font-size: 17px;
      }
    }
  </style>
</head>

<body>
  <div class="top"><span class="dot" id="dot"></span><span id="status">Not connected</span></div>

  <section class="hero">
    <div class="metric power"><span class="num" id="pw">–</span><span class="unit">W</span></div>
    <div class="metric cad"><span class="num" id="cd">–</span><span class="unit">rpm</span></div>
  </section>

  <section class="minor">
    <div><span class="k">Time</span><span class="v" id="el">0:00</span></div>
    <div><span class="k">Max</span><span class="v"><span id="mx">–</span> W</span></div>
  </section>

  <div class="chartwrap"><canvas id="chart"></canvas></div>

  <div id="connectBar" class="controls"><button id="btnConnect" class="primary">Connect power meter</button></div>
  <div class="controls"><button id="btnStart" class="go" hidden>Start</button></div>
  <div id="recBar" class="controls" hidden>
    <button id="btnPause">Pause</button>
    <button id="btnStop" class="danger">Stop &amp; save</button>
  </div>
  <div class="note" id="info"></div>

  <details>
    <summary>Saved rides &amp; tools</summary>
    <div id="sessions"></div>
    <div class="row">
      <label for="sport">Activity type:</label>
      <select id="sport">
        <option value="2,13">Track cycling</option>
        <option value="2,6">Indoor cycling</option>
        <option value="2,0">Cycling (generic)</option>
      </select>
    </div>
    <div class="row">
      <button id="btnSim">Simulate sensor</button>
      <button id="btnDisc" disabled>Disconnect</button>
    </div>
  </details>

  <script>
    // ============================================================
    // FIT encoder  (==FIT-START==)
    // ============================================================
    const FIT_EPOCH_OFFSET = 631065600; // seconds between Unix epoch and FIT epoch (1989-12-31)
    const BT = { ENUM: 0x00, U8: 0x02, U16: 0x84, U32: 0x86, U32Z: 0x8C };
    const BT_SIZE = { [BT.ENUM]: 1, [BT.U8]: 1, [BT.U16]: 2, [BT.U32]: 4, [BT.U32Z]: 4 };

    function fitCrc16(bytes, crc = 0) {
      const T = [0x0000, 0xCC01, 0xD801, 0x1400, 0xF001, 0x3C00, 0x2800, 0xE401, 0xA001, 0x6C00, 0x7800, 0xB401, 0x5000, 0x9C01, 0x8801, 0x4400];
      for (const b of bytes) {
        let tmp = T[crc & 0xF];
        crc = (crc >> 4) & 0x0FFF; crc = crc ^ tmp ^ T[b & 0xF];
        tmp = T[crc & 0xF];
        crc = (crc >> 4) & 0x0FFF; crc = crc ^ tmp ^ T[(b >> 4) & 0xF];
      }
      return crc;
    }
    const toFitTime = ms => Math.round(ms / 1000) - FIT_EPOCH_OFFSET;

    /**
     * records: [{t: unixMs, power: W, cadence: rpm}]
     * events:  [{t: unixMs, type: 'stop'|'start'}]  (pause / resume, in time order)
     * sport/subSport: FIT enums (cycling = 2; track_cycling = 13, indoor_cycling = 6)
     */
    function buildFit({ records, events = [], startMs, endMs, timerMs, sport = 2, subSport = 13 }) {
      const body = [];
      const u8 = v => body.push(v & 0xFF);
      const u16 = v => { body.push(v & 0xFF, (v >> 8) & 0xFF); };
      const u32 = v => { v = v >>> 0; body.push(v & 0xFF, (v >>> 8) & 0xFF, (v >>> 16) & 0xFF, (v >>> 24) & 0xFF); };
      const put = (type, v) => { if (BT_SIZE[type] === 1) u8(v); else if (BT_SIZE[type] === 2) u16(v); else u32(v); };

      // a message definition = [localType, globalMsgNum, [[fieldNum, baseType], ...]]
      const defs = {};
      function define(local, global, fields) {
        defs[local] = fields;
        u8(0x40 | local); u8(0); u8(0); u16(global); u8(fields.length);
        for (const [num, type] of fields) { u8(num); u8(BT_SIZE[type]); u8(type); }
      }
      function data(local, values) {
        u8(local);
        defs[local].forEach(([, type], i) => put(type, values[i]));
      }

      const L = { FILE_ID: 0, EVENT: 1, RECORD: 2, LAP: 3, SESSION: 4, ACTIVITY: 5, DEVICE: 6 };

      // ---- stats ----
      const n = records.length;
      const pw = records.map(r => r.power);
      const cd = records.map(r => r.cadence).filter(c => c > 0);
      const avgPower = n ? Math.round(pw.reduce((a, b) => a + b, 0) / n) : 0;
      const maxPower = n ? Math.max(...pw) : 0;
      const avgCad = cd.length ? Math.round(cd.reduce((a, b) => a + b, 0) / cd.length) : 0;
      const maxCad = cd.length ? Math.max(...cd) : 0;
      const elapsedMs = Math.max(0, endMs - startMs);
      const tMs = timerMs ?? elapsedMs;
      const startT = toFitTime(startMs), endT = toFitTime(endMs);

      const tzSec = -new Date(startMs).getTimezoneOffset() * 60; // local = UTC + offset
      // ---- file_id ----
      define(L.FILE_ID, 0, [[0, BT.ENUM], [1, BT.U16], [2, BT.U16], [3, BT.U32Z], [4, BT.U32]]);
      data(L.FILE_ID, [4 /*activity*/, 255 /*development*/, 0, 1, startT]);

      // ---- events + records, merged in time order ----
      define(L.EVENT, 21, [[253, BT.U32], [0, BT.ENUM], [1, BT.ENUM]]);
      define(L.RECORD, 20, [[253, BT.U32], [7, BT.U16], [3, BT.U8]]);
      data(L.EVENT, [startT, 0 /*timer*/, 0 /*start*/]);
      define(L.DEVICE, 23, [[253, BT.U32], [0, BT.U8], [2, BT.U16], [3, BT.U32Z], [4, BT.U16]]);
      data(L.DEVICE, [startT, 0 /*creator*/, 255, 1, 0]);
      let ei = 0;
      for (const r of records) {
        while (ei < events.length && events[ei].t <= r.t) {
          data(L.EVENT, [toFitTime(events[ei].t), 0, events[ei].type === 'stop' ? 4 : 0]); ei++;
        }
        data(L.RECORD, [toFitTime(r.t), Math.max(0, Math.min(0xFFFE, Math.round(r.power))), Math.max(0, Math.min(254, Math.round(r.cadence)))]);
      }
      while (ei < events.length) { data(L.EVENT, [toFitTime(events[ei].t), 0, events[ei].type === 'stop' ? 4 : 0]); ei++; }
      data(L.EVENT, [endT, 0, 4 /*stop_all*/]);

      // ---- lap ----
      define(L.LAP, 19, [[253, BT.U32], [2, BT.U32], [7, BT.U32], [8, BT.U32], [17, BT.U8], [18, BT.U8],
      [19, BT.U16], [20, BT.U16], [0, BT.ENUM], [1, BT.ENUM], [25, BT.ENUM], [39, BT.ENUM], [254, BT.U16]]);
      data(L.LAP, [endT, startT, elapsedMs, tMs, avgCad, maxCad, avgPower, maxPower, 9 /*lap*/, 1 /*stop*/, sport, subSport, 0]);

      // ---- session ----
      define(L.SESSION, 18, [[253, BT.U32], [2, BT.U32], [7, BT.U32], [8, BT.U32], [18, BT.U8], [19, BT.U8],
      [20, BT.U16], [21, BT.U16], [5, BT.ENUM], [6, BT.ENUM], [25, BT.U16], [26, BT.U16],
      [0, BT.ENUM], [1, BT.ENUM], [254, BT.U16]]);
      data(L.SESSION, [endT, startT, elapsedMs, tMs, avgCad, maxCad, avgPower, maxPower, sport, subSport, 0, 1, 8 /*session*/, 1, 0]);

      // ---- activity ----
      define(L.ACTIVITY, 34, [[253, BT.U32], [0, BT.U32], [1, BT.U16], [2, BT.ENUM], [3, BT.ENUM], [4, BT.ENUM], [5, BT.U32]]);
      data(L.ACTIVITY, [endT, tMs, 1, 0 /*manual*/, 26 /*activity*/, 1 /*stop*/, endT + tzSec]);

      // ---- header + CRCs ----
      const hdr = [];
      const h8 = v => hdr.push(v & 0xFF);
      const h16 = v => hdr.push(v & 0xFF, (v >> 8) & 0xFF);
      const h32 = v => hdr.push(v & 0xFF, (v >>> 8) & 0xFF, (v >>> 16) & 0xFF, (v >>> 24) & 0xFF);
      h8(14); h8(0x20); h16(2132); h32(body.length);
      hdr.push(0x2E, 0x46, 0x49, 0x54); // ".FIT"
      h16(fitCrc16(hdr));
      const all = hdr.concat(body);
      const crc = fitCrc16(all);
      all.push(crc & 0xFF, (crc >> 8) & 0xFF);
      return new Uint8Array(all);
    }

    // ============================================================
    // Cycling Power Measurement (0x2A63) parser
    // ============================================================
    class CpsParser {
      constructor() { this.prev = null; this.cadence = 0; this.lastCrankChange = 0; }
      parse(dv, now = Date.now()) {
        const flags = dv.getUint16(0, true);
        const power = dv.getInt16(2, true);
        let o = 4;
        if (flags & 0x01) o += 1;   // pedal power balance
        if (flags & 0x04) o += 2;   // accumulated torque
        if (flags & 0x10) o += 6;   // wheel revolution data
        if (flags & 0x20 && dv.byteLength >= o + 4) {   // crank revolution data
          const revs = dv.getUint16(o, true), time = dv.getUint16(o + 2, true); // time: 1/1024 s
          if (this.prev) {
            const dR = (revs - this.prev.revs) & 0xFFFF;
            const dT = (time - this.prev.time) & 0xFFFF;
            if (dT > 0) {
              const rpm = dR * 60 * 1024 / dT;
              if (rpm < 250) this.cadence = Math.round(rpm);
              this.lastCrankChange = now;
              this.prev = { revs, time };
            }
          } else { this.prev = { revs, time }; this.lastCrankChange = now; }
        }
        return { power: Math.max(0, power), hasCrank: !!(flags & 0x20) };
      }
      current(now = Date.now()) {
        // no new crank event for 2.5 s → coasting / stopped
        return now - this.lastCrankChange > 2500 ? 0 : this.cadence;
      }
    }
    // ==FIT-END==

    // ============================================================
    // App
    // ============================================================
    const $ = id => document.getElementById(id);
    const state = {
      device: null, char: null, sim: null, simTimer: null,
      parser: new CpsParser(), livePower: 0, lastPowerAt: 0,
      recording: false, paused: false,
      records: [], events: [], startMs: 0, timerMs: 0, lastTickMs: 0,
      tickTimer: null, wakeLock: null, graph: []
    };

    function setStatus(text, cls) {
      $('status').textContent = text;
      $('dot').className = 'dot' + (cls ? ' ' + cls : '');
    }
    function fmtTime(ms) {
      const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
      return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(ss).padStart(2, '0');
    }
    function currentPower() { return Date.now() - state.lastPowerAt > 3000 ? 0 : state.livePower; }
    function connected() { return !!(state.char || state.sim); }

    function updateButtons() {
      const c = connected();
      $('connectBar').hidden = c;
      $('btnStart').hidden = !c || state.recording;
      $('recBar').hidden = !state.recording;
      $('btnSim').disabled = c; $('btnDisc').disabled = !c;
      $('btnPause').textContent = state.paused ? 'Resume' : 'Pause';
    }

    // ---- Bluetooth ----
    async function connectBle() {
      if (!navigator.bluetooth) { alert('Web Bluetooth is not available in this browser. Use Chrome or Edge on desktop/Android.'); return; }
      try {
        setStatus('Choose your power meter…');
        const dev = await navigator.bluetooth.requestDevice({ filters: [{ services: ['cycling_power'] }] });
        state.device = dev;
        dev.addEventListener('gattserverdisconnected', onBleDisconnect);
        await attach(dev);
      } catch (e) { setStatus('Not connected' + (e.name !== 'NotFoundError' ? ' (' + e.message + ')' : '')); }
    }
    async function attach(dev) {
      setStatus('Connecting to ' + (dev.name || 'sensor') + '…');
      const server = await dev.gatt.connect();
      const svc = await server.getPrimaryService('cycling_power');
      const ch = await svc.getCharacteristic('cycling_power_measurement');
      state.parser = new CpsParser();
      ch.addEventListener('characteristicvaluechanged', ev => {
        const r = state.parser.parse(ev.target.value);
        state.livePower = r.power; state.lastPowerAt = Date.now();
      });
      await ch.startNotifications();
      state.char = ch;
      setStatus('Connected: ' + (dev.name || 'power meter'), 'on');
      updateButtons();
    }
    async function onBleDisconnect() {
      state.char = null; updateButtons();
      setStatus('Sensor disconnected' + (state.recording ? ' – recording continues with 0 W, reconnecting…' : '…'));
      for (let i = 0; i < 10 && state.device && !state.char; i++) {
        try { await new Promise(r => setTimeout(r, 1500)); await attach(state.device); return; } catch (_) { }
      }
      if (!state.char) setStatus('Sensor lost. Press Disconnect, then connect again.');
    }
    function disconnect() {
      const d = state.device; state.device = null;
      if (d && d.gatt.connected) d.removeEventListener('gattserverdisconnected', onBleDisconnect), d.gatt.disconnect();
      state.char = null;
      if (state.simTimer) { clearInterval(state.simTimer); state.simTimer = null; state.sim = null; }
      state.livePower = 0; state.parser = new CpsParser();
      setStatus('Not connected'); updateButtons();
    }

    // ---- Simulator (for testing without hardware) ----
    function startSim() {
      state.sim = true; const t0 = Date.now();
      state.simTimer = setInterval(() => {
        const t = (Date.now() - t0) / 1000;
        state.livePower = Math.max(0, Math.round(220 + 140 * Math.sin(t / 9) + (Math.random() - .5) * 30));
        state.lastPowerAt = Date.now();
        state.parser.cadence = Math.round(95 + 12 * Math.sin(t / 6));
        state.parser.lastCrankChange = Date.now();
      }, 250);
      setStatus('Simulated sensor running', 'on'); updateButtons();
    }

    // ---- Recording ----
    async function startRec() {
      Object.assign(state, {
        recording: true, paused: false, records: [], events: [], graph: [],
        startMs: Date.now(), timerMs: 0, lastTickMs: Date.now()
      });
      try { state.wakeLock = await navigator.wakeLock?.request('screen'); } catch (_) { }
      state.tickTimer = setInterval(tick, 1000);
      setStatus('Recording', 'rec'); updateButtons();
    }
    function tick() {
      const now = Date.now();
      if (!state.paused) {
        state.timerMs += now - state.lastTickMs;
        state.records.push({ t: now, power: currentPower(), cadence: state.parser.current(now) });
        if (state.records.length % 10 === 0) saveDraft();
      }
      state.lastTickMs = now;
    }
    function togglePause() {
      const now = Date.now();
      if (!state.paused) { tick(); state.paused = true; state.events.push({ t: now, type: 'stop' }); setStatus('Paused', 'on'); }
      else { state.paused = false; state.lastTickMs = now; state.events.push({ t: now, type: 'start' }); setStatus('Recording', 'rec'); }
      updateButtons();
    }
    function stopRec() {
      tick();
      clearInterval(state.tickTimer); state.tickTimer = null;
      state.wakeLock?.release?.().catch(() => { }); state.wakeLock = null;
      const endMs = Date.now();
      state.recording = false; state.paused = false;
      setStatus(connected() ? 'Connected' : 'Not connected', connected() ? 'on' : '');
      updateButtons();
      try { localStorage.removeItem(DRAFT_KEY); } catch (_) { }
      if (state.records.length < 2) { alert('Recording too short to keep.'); return; }
      const [sport, subSport] = $('sport').value.split(',').map(Number);
      addSession({
        id: state.startMs, startMs: state.startMs, endMs, timerMs: state.timerMs, sport, subSport,
        events: state.events, records: state.records.map(r => [r.t, r.power, r.cadence])
      });
      $('info').textContent = 'Session saved on this device. Tap Export below to save or share it.';
    }

    // ---- Saved sessions (last 2 kept on this device) ----
    const STORE_KEY = 'powerRecorder.sessions.v1', DRAFT_KEY = 'powerRecorder.draft.v1', MAX_SESSIONS = 2;
    function loadSessions() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch (_) { return []; } }
    function storeSessions(list) {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(list)); return true; }
      catch (e) { alert('Could not save the session on this device: ' + e.message); return false; }
    }
    function addSession(s) {
      const list = [s, ...loadSessions().filter(x => x.id !== s.id)].slice(0, MAX_SESSIONS); // newest first, oldest dropped
      storeSessions(list); renderSessions();
    }
    function saveDraft() { // crash / refresh protection while recording
      try {
        localStorage.setItem(DRAFT_KEY, JSON.stringify({
          startMs: state.startMs, timerMs: state.timerMs, events: state.events,
          sport: $('sport').value, records: state.records.map(r => [r.t, r.power, r.cadence])
        }));
      } catch (_) { }
    }
    function recoverDraft() {
      try {
        const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
        localStorage.removeItem(DRAFT_KEY);
        if (!d || !d.records || d.records.length < 2) return;
        const [sport, subSport] = (d.sport || '2,13').split(',').map(Number);
        addSession({
          id: d.startMs, startMs: d.startMs, endMs: d.records[d.records.length - 1][0], timerMs: d.timerMs,
          sport, subSport, events: d.events || [], records: d.records, recovered: true
        });
      } catch (_) { }
    }
    function sessionName(s) {
      const d = new Date(s.startMs), p = n => String(n).padStart(2, '0');
      return `ride-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.fit`;
    }
    function sessionFile(s) {
      const bytes = buildFit({
        records: s.records.map(([t, power, cadence]) => ({ t, power, cadence })), events: s.events,
        startMs: s.startMs, endMs: s.endMs, timerMs: s.timerMs, sport: s.sport, subSport: s.subSport
      });
      return new File([bytes], sessionName(s), { type: 'application/octet-stream' });
    }
    function getSession(id) { return loadSessions().find(s => s.id === id); }
    async function shareSession(id) {
      const s = getSession(id); if (!s) return;
      const file = sessionFile(s);
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: file.name }); return; }
        catch (e) { if (e.name === 'AbortError') return; }
      }
      downloadSession(id); // browser can't share files: fall back to a normal download
    }
    function downloadSession(id) {
      const s = getSession(id); if (!s) return;
      const file = sessionFile(s);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(file); a.download = file.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    }
    function deleteSession(id) {
      if (!confirm('Delete this session from the device? This cannot be undone.')) return;
      storeSessions(loadSessions().filter(s => s.id !== id)); renderSessions();
    }
    function renderSessions() {
      const box = $('sessions'), list = loadSessions();
      box.innerHTML = '';
      if (!list.length) { box.innerHTML = '<div class="note">No saved sessions yet. The last 2 are kept here.</div>'; return; }
      for (const s of list) {
        const pw = s.records.map(r => r[1]);
        const avg = Math.round(pw.reduce((a, b) => a + b, 0) / pw.length), max = Math.max(...pw);
        const el = document.createElement('div'); el.className = 'sess';
        el.innerHTML = `<div><b>${new Date(s.startMs).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}</b>${s.recovered ? ' <span class="note">(recovered)</span>' : ''}</div>
      <div class="note">${fmtTime(s.timerMs)} · avg ${avg} W · max ${max} W · ${s.records.length} samples</div>
      <div class="row"></div>`;
        const row = el.querySelector('.row');
        for (const [label, fn, cls] of [['Export', shareSession, 'primary'], ['Delete', deleteSession, 'danger']]) {
          const b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls;
          b.onclick = () => fn(s.id); row.appendChild(b);
        }
        box.appendChild(el);
      }
    }

    // ---- UI refresh ----
    const WINDOW_MS = 120000; // graph shows the last 2 minutes of power
    function niceMax(v) { const step = v > 600 ? 200 : 100; return Math.max(300, Math.ceil(v / step) * step); }
    function draw() {
      const c = $('chart'), dpr = window.devicePixelRatio || 1;
      const w = c.clientWidth, h = c.clientHeight; if (!w || !h) return;
      if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
      const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
      const css = getComputedStyle(document.body);
      const now = Date.now(), pts = state.graph.filter(p => now - p[0] <= WINDOW_MS);
      const top = niceMax(Math.max(0, ...pts.map(p => p[1])));
      const padL = 34, padB = 18, padT = 6, plotW = w - padL, plotH = h - padB - padT;
      const X = t => padL + (1 - (now - t) / WINDOW_MS) * plotW, Y = v => padT + plotH - v / top * plotH;
      g.font = '11px system-ui,sans-serif'; g.fillStyle = css.getPropertyValue('--mut'); g.strokeStyle = css.getPropertyValue('--line'); g.lineWidth = 1;
      g.textBaseline = 'middle'; g.textAlign = 'right';
      for (const v of [0, top / 2, top]) { const y = Math.round(Y(v)) + .5; g.beginPath(); g.moveTo(padL, y); g.lineTo(w, y); g.stroke(); g.fillText(Math.round(v), padL - 6, y); }
      g.textBaseline = 'alphabetic'; g.textAlign = 'left'; g.fillText('-2 min', padL, h - 3);
      g.textAlign = 'right'; g.fillText('now', w, h - 3);
      if (pts.length < 2) return;
      const col = css.getPropertyValue('--pow').trim();
      g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(X(p[0]), Y(p[1])) : g.moveTo(X(p[0]), Y(p[1])));
      g.lineTo(X(pts[pts.length - 1][0]), Y(0)); g.lineTo(X(pts[0][0]), Y(0)); g.closePath();
      const grad = g.createLinearGradient(0, padT, 0, padT + plotH); grad.addColorStop(0, col + '55'); grad.addColorStop(1, col + '00');
      g.fillStyle = grad; g.fill();
      g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(X(p[0]), Y(p[1])) : g.moveTo(X(p[0]), Y(p[1])));
      g.strokeStyle = col; g.lineWidth = 2.5; g.lineJoin = 'round'; g.stroke();
    }
    setInterval(() => {
      const c = connected(), p = currentPower(), cad = state.parser.current();
      $('pw').textContent = c ? p : '–';
      $('cd').textContent = c ? cad : '–';
      if (c) { state.graph.push([Date.now(), p]); if (state.graph.length > 400) state.graph.shift(); }
      if (state.recording) {
        $('el').textContent = fmtTime(state.timerMs + (state.paused ? 0 : Date.now() - state.lastTickMs));
        let m = 0; for (const r of state.records) if (r.power > m) m = r.power;
        $('mx').textContent = state.records.length ? m : '–';
        $('info').textContent = '';
      } else { $('el').textContent = '0:00'; $('mx').textContent = '–'; }
      draw();
    }, 1000);
    window.addEventListener('resize', draw);

    $('btnConnect').onclick = connectBle;
    $('btnSim').onclick = startSim;
    $('btnDisc').onclick = () => { if (state.recording && !confirm('Recording is running. Disconnect anyway?')) return; disconnect(); };
    $('btnStart').onclick = startRec;
    $('btnPause').onclick = togglePause;
    $('btnStop').onclick = () => { if (confirm('Stop and save this ride?')) stopRec(); };
    window.addEventListener('beforeunload', e => { if (state.recording) { e.preventDefault(); e.returnValue = ''; } });
    updateButtons();
    recoverDraft();
    renderSessions();
  </script>
</body>

</html>
